name: CI/CD

# CI chạy ở MỌI push và MỌI pull request — bắt lỗi trước khi merge mới là
# mục đích chính. Deploy chỉ chạy từ nhánh chính, sau khi test xanh.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quyền tối thiểu cần thiết.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. TEST — cài dependency rồi chạy checkpoint.
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # CP5 gọi vào service ĐÃ deploy nên chạy trong CI sẽ luôn đỏ.
      # Test build Docker cũng bỏ qua ở đây — job `build` lo phần đó.
      - name: Run tests
        env:
          AGENT_API_KEY: ci-test-key
          REDIS_URL: fake://
        run: pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py

  # ─────────────────────────────────────────────────────────────
  # 2. BUILD — Dockerfile hỏng mà chỉ phát hiện lúc deploy là quá muộn.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: day12-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: docker images day12-agent:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  # ─────────────────────────────────────────────────────────────
  # 3. DEPLOY — cổng chất lượng: chỉ chạy khi test VÀ build đều xanh,
  #    và chỉ từ nhánh chính (pull request không được kéo theo deploy).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        env:
          # Deploy hook lấy từ Settings → Secrets and variables → Actions,
          # KHÔNG nằm trong file này.
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK chưa được set — bỏ qua bước deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Đã gửi yêu cầu deploy lên Render."
